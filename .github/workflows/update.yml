name: 每日自动更新 KOR.m3u

on:
  schedule:
    - cron: '0 4 * * *'        # 每天 UTC 4:00（北京时间 12:00）
  workflow_dispatch:           # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 下载最新的韩国直播源
        run: |
          curl -L https://raw.githubusercontent.com/GoonhoLee/koreaiptv-auto-updater/main/korean_tv_china_optimized.m3u -o KOR.m3u

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KOR.m3u
          git diff --staged --quiet || git commit -m "自动更新 KOR.m3u $(date +%Y-%m-%d)"
          git push
